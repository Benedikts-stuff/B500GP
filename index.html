<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>APEX — Motorcycle Racing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23e8372c'/><path d='M14 46 L30 16 h6 L52 46 h-9 l-3-7 H26 l-3 7z M29 32h8l-4-9z' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div class="pod hud-pos">
    <div class="pos-big"><span id="hPos">1</span><small id="hPosOf">/8</small></div>
    <div class="pos-lap"><span data-i18n="lap">RUNDE</span> <b id="hLap">1/3</b></div>
  </div>
  <div class="pod hud-time">
    <div id="hTime">0:00.000</div>
    <div class="time-sub"><span id="hDelta" class="delta"></span><span><i data-i18n="best">BEST</i> <b id="hBest">–</b></span><span><i data-i18n="last">LETZTE</i> <b id="hLast">–</b></span></div>
  </div>
  <div class="hud-map"><canvas id="minimap" width="220" height="220"></canvas></div>
  <div id="fps">– FPS</div>
  <div id="tower" class="tower"></div>
  <div class="pod hud-speed">
    <div class="gear" id="hGear">1</div>
    <div class="body-ind" id="hBody" title="Körpergewicht / body weight"><i id="hBodyDot"></i></div>
    <div class="speed"><span id="hSpeed">0</span><small>KM/H</small></div>
    <div class="rev"><div id="hRev"></div><div class="rev-red"></div></div>
    <div class="pedals"><i id="hThr"></i><i id="hBrk"></i></div>
  </div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="banner" class="hidden"></div>
  <div id="toast"></div>
  <div id="hint"></div>
</div>

<!-- ============ MENU ============ -->
<div id="menu" class="screen">
  <div class="menu-left">
    <div class="logo">APEX<span>MOTORCYCLE RACING</span></div>
    <div class="seg big" id="segMode">
      <button data-v="race" data-i18n="modeRace">RENNEN</button>
      <button data-v="tt" data-i18n="modeTT">ZEITFAHREN</button>
    </div>
    <div class="opts">
      <div class="opt race-only"><label data-i18n="laps">RUNDEN</label><div class="seg" id="segLaps"><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button><button data-v="8">8</button></div></div>
      <div class="opt race-only"><label data-i18n="opponents">GEGNER</label><div class="seg" id="segOpp"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button><button data-v="9">9</button></div></div>
      <div class="opt race-only"><label data-i18n="difficulty">KI-STÄRKE</label><div class="seg" id="segDiff"><button data-v="0" data-i18n="d0">LEICHT</button><button data-v="1" data-i18n="d1">MITTEL</button><button data-v="2" data-i18n="d2">SCHWER</button><button data-v="3" data-i18n="d3">PROFI</button></div></div>
      <div class="opt"><label data-i18n="assists">FAHRHILFEN</label><div class="seg" id="segAssist"><button data-v="easy" data-i18n="a0">VOLL</button><button data-v="sport" data-i18n="a1">SPORT</button><button data-v="pro" data-i18n="a2">AUS</button></div></div>
      <div class="opt-note" id="assistNote"></div>
      <div class="opt"><label data-i18n="camera">KAMERA</label><div class="seg" id="segCam"><button data-v="chase" data-i18n="c0">VERFOLGER</button><button data-v="pov" data-i18n="c1">FAHRERSICHT</button><button data-v="tv" data-i18n="c2">TOP-DOWN</button></div></div>
      <div class="opt"><label data-i18n="quality">GRAFIK</label><div class="seg" id="segQ"><button data-v="low" data-i18n="q0">NIEDRIG</button><button data-v="medium" data-i18n="q1">MITTEL</button><button data-v="high" data-i18n="q2">HOCH</button></div></div>
      <div class="opt"><label data-i18n="volume">LAUTSTÄRKE</label><input type="range" id="vol" min="0" max="100" value="80"><div class="seg" id="segLang"><button data-v="de">DE</button><button data-v="en">EN</button></div></div>
    </div>
    <button id="startBtn" class="go"><span data-i18n="start">START</span><em>ENTER</em></button>
    <div class="keys" id="keysHelp"></div>
  </div>
  <div class="menu-right">
    <div class="sect"><span data-i18n="chooseBike">MOTORRAD</span></div>
    <div class="cards" id="bikeCards"></div>
    <div class="sect"><span data-i18n="chooseTrack">STRECKE</span></div>
    <div class="cards" id="trackCards"></div>
  </div>
</div>

<!-- ============ PAUSE / RESULTS ============ -->
<div id="pause" class="screen overlay hidden">
  <div class="panel">
    <h2 data-i18n="paused">PAUSE</h2>
    <button id="btnResume" class="go small"><span data-i18n="resume">WEITER</span><em>ESC</em></button>
    <button id="btnRestart" class="ghost" data-i18n="restart">NEUSTART</button>
    <button id="btnQuit" class="ghost" data-i18n="toMenu">HAUPTMENÜ</button>
    <div class="keys" id="keysHelp2"></div>
  </div>
</div>
<div id="results" class="screen overlay hidden">
  <div class="panel wide">
    <h2 id="resTitle">ERGEBNIS</h2>
    <div id="resSub" class="res-sub"></div>
    <table id="resTable"></table>
    <div class="row">
      <button id="btnAgain" class="go small"><span data-i18n="again">NOCHMAL</span><em>ENTER</em></button>
      <button id="btnMenu" class="ghost" data-i18n="toMenu">HAUPTMENÜ</button>
    </div>
  </div>
</div>
<div id="loading" class="hidden"><div><b>APEX</b><span id="loadText">…</span></div></div>

<script src="three.min.js?v=23"></script>
<script src="js/core.js?v=23"></script>
<script src="js/track.js?v=23"></script>
<script src="js/physics.js?v=23"></script>
<script src="js/ai.js?v=23"></script>
<script src="js/assets.js?v=23"></script>
<script src="assets/pack_nature.js?v=23"></script>
<script src="assets/pack_kenney.js?v=23"></script>
<script src="assets/pack_pass.js?v=23"></script>
<script src="assets/pack_props.js?v=23"></script>
<script src="assets/pack_kaykit.js?v=23"></script>
<script src="assets/pack_bike.js?v=23"></script>
<script src="assets/pack_rider.js?v=23"></script>
<script src="js/models.js?v=23"></script>
<script src="js/world.js?v=23"></script>
<script src="js/pass.js?v=23"></script>
<script src="js/fx.js?v=23"></script>
<script src="js/audio.js?v=23"></script>
<script src="js/game.js?v=23"></script>
</body>
</html>
