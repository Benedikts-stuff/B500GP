<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>APEX — Schwarzhornpass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f3efe6'/><path d='M12 48 L32 14 L52 48 h-9 L32 29 L21 48z' fill='%231d1f22'/></svg>">
<link rel="stylesheet" href="style.css?v=59">
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div class="h-time">
    <div id="hTime">0:00.000</div>
    <div class="h-sub"><span id="hDelta" class="delta"></span><span class="h-best"><i data-i18n="best">BEST</i><b id="hBest">–</b></span></div>
  </div>
  <div class="h-pos hidden" id="hPosBox"><b id="hPos">1</b><small id="hPosOf">/6</small></div>
  <div id="tower" class="tower"></div>
  <div class="h-map">
    <canvas id="minimap" width="220" height="220"></canvas>
    <div class="h-rem" id="hRem"></div>
  </div>
  <div id="fps" class="hidden">– FPS</div>
  <div class="h-speed">
    <div class="h-row">
      <div class="h-spd"><span id="hSpeed">0</span><small>km/h</small></div>
      <div class="h-gear"><b id="hGear">1</b></div>
    </div>
    <div class="rev"><div id="hRev"></div></div>
    <div class="pedals"><i id="hThr"></i><i id="hBrk"></i></div>
    <div class="body-ind" id="hBody" title="Körpergewicht / body weight"><i id="hBodyDot"></i></div>
  </div>
  <div id="split" class="split"></div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="banner" class="hidden"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="steerBar"><i></i></div>
</div>

<!-- ============ MENU ============ -->
<div id="menu" class="screen">
  <div class="m-col">
    <div class="brand">
      <div class="brand-mark">APEX</div>
      <div class="brand-sub" id="brandSub">SCHWARZHORNPASS</div>
    </div>
    <div class="m-head" id="mHead"></div>
    <div class="m-list" id="mList"></div>
    <div class="m-note" id="mNote"></div>
    <div class="m-keys" id="mKeys"></div>
  </div>
  <div class="m-side" id="mSide">
    <div class="info" id="bikeInfo"></div>
    <div class="info" id="trackInfo"></div>
  </div>
  <div class="controls hidden" id="mControls"></div>
</div>

<!-- ============ PAUSE / RESULTS ============ -->
<div id="pause" class="screen overlay hidden">
  <div class="ov">
    <div class="ov-kicker" id="pauseSub"></div>
    <h2 data-i18n="paused">PAUSE</h2>
    <div class="m-list" id="pList"></div>
  </div>
</div>
<div id="results" class="screen overlay hidden">
  <div class="ov wide">
    <div class="ov-kicker" id="resSub"></div>
    <h2 id="resTitle">0:00.000</h2>
    <div class="res-delta" id="resDelta"></div>
    <div class="medals" id="resMedals"></div>
    <table id="resTable"></table>
    <div class="m-list horiz" id="rList"></div>
  </div>
</div>
<div id="loading" class="hidden"><div><b>APEX</b><span id="loadText">…</span></div></div>

<script src="three.min.js?v=59"></script>
<script src="js/core.js?v=59"></script>
<script src="js/track.js?v=59"></script>
<script src="js/physics.js?v=59"></script>
<script src="js/ai.js?v=59"></script>
<script src="js/assets.js?v=59"></script>
<script src="assets/pack_nature.js?v=59"></script>
<script src="assets/pack_kenney.js?v=59"></script>
<script src="assets/pack_pass.js?v=59"></script>
<script src="assets/pack_props.js?v=59"></script>
<script src="assets/pack_kaykit.js?v=59"></script>
<script src="assets/pack_bike.js?v=59"></script>
<script src="assets/pack_rider.js?v=59"></script>
<script src="js/models.js?v=59"></script>
<script src="js/world.js?v=59"></script>
<script src="js/pass.js?v=59"></script>
<script src="js/passstyle.js?v=59"></script>
<script src="js/fx.js?v=59"></script>
<script src="js/audio.js?v=59"></script>
<script src="js/game.js?v=59"></script>
</body>
</html>
